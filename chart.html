<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>myProjectPlan — Gantt Chart</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">my<span>ProjectPlan</span></a>
    <div class="topbar-actions">
      <a class="btn ghost" href="index.html">&#8592; Edit tasks</a>
      <button type="button" id="btn-export-csv" class="btn primary">Export CSV</button>
    </div>
  </header>

  <main class="container wide">
    <section id="chart-card" class="card">
      <div id="chart-header" class="chart-header"></div>
      <div class="legend" id="legend"></div>
      <div id="gantt-scroll" class="gantt-scroll"></div>
    </section>
    <section id="error-panel" class="card errors hidden"></section>
  </main>

  <footer class="footer">myProjectPlan &mdash; your project is saved automatically in this browser.</footer>

  <script src="js/model.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/gantt.js"></script>
</body>
</html>
